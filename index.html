<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WELLBI Archive</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= 헤더 ================= -->
<header class="header">
  <div class="header-inner">
    <a href="#/" class="brand">
      <span class="brand-mark">W</span>
      <span class="brand-text">
        <strong>WELLBI Archive</strong>
        <small>MICE Project Portfolio &amp; Records</small>
      </span>
    </a>

    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
      <input type="search" id="searchInput" placeholder="프로젝트 · 발주처 · 카테고리(예: 기념품) 검색">
    </div>
  </div>
</header>

<!-- ================= 메인 영역 (뷰가 여기 렌더링됨) ================= -->
<main id="app" class="main"></main>

<footer class="footer">
  <span id="footerStats"></span>
  <span>WELLBI Archive · Internal Use · <a href="admin.html" class="admin-link">관리자</a></span>
</footer>

<!-- ================= 라이트박스 뷰어 ================= -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lb-backdrop"></div>
  <div class="lb-dialog" role="dialog" aria-modal="true">
    <button class="lb-close" id="lbClose" aria-label="닫기">&times;</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="이전">&#8249;</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="다음">&#8250;</button>
    <div class="lb-stage" id="lbStage"></div>
    <div class="lb-info">
      <div>
        <div class="lb-title" id="lbTitle"></div>
        <div class="lb-desc" id="lbDesc"></div>
      </div>
      <div class="lb-actions" id="lbActions"></div>
    </div>
    <div class="lb-counter" id="lbCounter"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
