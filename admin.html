<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WELLBI Archive · 관리자</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<!-- ================= 로그인 ================= -->
<section id="loginView" class="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand" style="margin-bottom:28px">
      <span class="brand-mark">W</span>
      <span class="brand-text"><strong>WELLBI Archive</strong><small>관리자 로그인</small></span>
    </div>
    <label class="f"><span>이메일</span><input type="email" name="email" value="admin@wellbi.co.kr" required autocomplete="username"></label>
    <label class="f"><span>비밀번호</span><input type="password" name="pw" value="admin1234" required autocomplete="current-password"></label>
    <div class="login-err" id="loginErr"></div>
    <button class="btn primary block" type="submit">로그인</button>
    <p class="login-hint">프로토타입 기본 계정: admin@wellbi.co.kr / admin1234<br>실제 운영 시 Supabase Auth로 교체됩니다.</p>
    <a class="login-back" href="index.html">← 아카이브로 돌아가기</a>
  </form>
</section>

<!-- ================= 관리자 셸 ================= -->
<div id="adminView" class="admin" hidden>
  <aside class="side">
    <a class="brand" href="index.html" target="_blank">
      <span class="brand-mark">W</span>
      <span class="brand-text"><strong>WELLBI Archive</strong><small>Admin Console</small></span>
    </a>

    <nav class="side-nav">
      <a href="#/projects" data-nav="projects">📁 프로젝트 관리</a>
      <a href="#/new" data-nav="new">＋ 새 프로젝트</a>
      <a href="#/users" data-nav="users" data-admin-only>👥 구성원 관리</a>
      <a href="#/settings" data-nav="settings">⚙ 설정 · 백업</a>
    </nav>

    <div class="side-foot">
      <div class="me"><b id="meName"></b><small id="meRole"></small></div>
      <button class="btn ghost sm" id="logoutBtn">로그아웃</button>
      <a class="btn ghost sm" href="index.html" target="_blank">사이트 보기 ↗</a>
    </div>
  </aside>

  <main class="content" id="content"></main>
</div>

<!-- 토스트 -->
<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="storage.js"></script>
<script src="admin.js"></script>
</body>
</html>
